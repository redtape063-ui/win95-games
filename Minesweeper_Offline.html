<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="지뢰찾기" />
  <meta name="theme-color" content="#000080" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Win95 지뢰찾기</title>
  <style>
    :root {
      --win-teal: #008080;
      --win-gray: #c0c0c0;
      --win-light: #ffffff;
      --win-dark: #808080;
      --win-black: #000000;
      --win-navy: #000080;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--win-teal);
      font-family: "Courier New", Courier, -apple-system, BlinkMacSystemFont, monospace;
    }
    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: max(4px, env(safe-area-inset-top)) 4px max(4px, env(safe-area-inset-bottom)) 4px;
    }
    .win95-window {
      display: flex;
      flex-direction: column;
      flex: 1;
      background: var(--win-gray);
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-black);
      border-bottom: 2px solid var(--win-black);
      box-shadow: inset -1px -1px 0 var(--win-dark), inset 1px 1px 0 #dfdfdf;
      overflow: hidden;
    }
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, var(--win-navy), #1084d0);
      color: #fff;
      padding: 4px 6px;
      font-size: 13px;
      font-weight: bold;
    }
    .win95-btn {
      background: var(--win-gray);
      color: #000;
      border-top: 2px solid var(--win-light);
      border-left: 2px solid var(--win-light);
      border-right: 2px solid var(--win-black);
      border-bottom: 2px solid var(--win-black);
      box-shadow: inset -1px -1px 0 var(--win-dark);
      padding: 5px 8px;
      font-size: 12px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .win95-btn:active, .win95-btn.active {
      border-top: 2px solid var(--win-black);
      border-left: 2px solid var(--win-black);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      box-shadow: inset 1px 1px 0 var(--win-dark);
      background: #dcdcdc;
    }
    .win95-btn:disabled {
      color: var(--win-dark);
      pointer-events: none;
    }
    .toolbar {
      display: flex;
      gap: 5px;
      padding: 5px 6px;
      overflow-x: auto;
      background: var(--win-gray);
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .header-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 6px 6px 6px;
      padding: 6px 10px;
      border-top: 2px solid var(--win-dark);
      border-left: 2px solid var(--win-dark);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
    }
    .led-box {
      background: #000;
      color: #ff1818;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 2px 6px;
      border-top: 2px solid var(--win-dark);
      border-left: 2px solid var(--win-dark);
      border-right: 2px solid var(--win-light);
      border-bottom: 2px solid var(--win-light);
      text-shadow: 0 0 5px rgba(255, 0, 0, 0.65);
      min-width: 62px;
      text-align: center;
    }
    .smiley-btn {
      width: 38px;
      height: 36px;
      font-size: 21px;
      padding: 0;
    }
    .board-scroll {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .mine-grid {
      display: grid;
      border-top: 3px solid var(--win-dark);
      border-left: 3px solid var(--win-dark);
      border-right: 3px solid var(--win-light);
      border-bottom: 3px solid var(--win-light);
      background: var(--win-gray);
      margin: auto;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      background: var(--win-gray);
      border-top: 2.5px solid var(--win-light);
      border-left: 2.5px solid var(--win-light);
      border-right: 2.5px solid var(--win-dark);
      border-bottom: 2.5px solid var(--win-dark);
      cursor: pointer;
    }
    .cell.revealed {
      border: 0.5px solid #8c8c8c;
      background: #c0c0c0;
    }
    .cell.triggered {
      background: #ff2020;
    }
    .cell.hint-safe {
      background: #88ff88;
    }
    .cell.chord-preview {
      border: 0.5px solid #8c8c8c;
      background: #b8b8b8;
    }
    .n1 { color: #0000ff; }
    .n2 { color: #008000; }
    .n3 { color: #ff0000; }
    .n4 { color: #000080; }
    .n5 { color: #800000; }
    .n6 { color: #008080; }
    .n7 { color: #000000; }
    .n8 { color: #808080; }
    .mode-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 4px 6px;
    }
    .mode-btn {
      padding: 9px;
      font-size: 13px;
    }
    .mode-btn.flag-active {
      background: #fff394;
      color: #b00000;
    }
    .status-bar {
      padding: 4px 6px;
    }
    .status-box {
      border-top: 1px solid var(--win-dark);
      border-left: 1px solid var(--win-dark);
      border-right: 1px solid var(--win-light);
      border-bottom: 1px solid var(--win-light);
      padding: 4px 6px;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="win95-window">
      <div class="title-bar">
        <div style="display:flex;align-items:center;gap:6px;">
          <span>💣</span>
          <span>지뢰찾기 (Minesweeper)</span>
        </div>
        <button class="win95-btn" id="btn-sound" style="padding: 1px 5px;">🔊</button>
      </div>

      <div class="toolbar">
        <button class="win95-btn diff-btn active" data-diff="beginner">초급 (9x9)</button>
        <button class="win95-btn diff-btn" data-diff="intermediate">중급 (16x16)</button>
        <button class="win95-btn diff-btn" data-diff="expert">고급 (16x30)</button>
        <button class="win95-btn" id="btn-undo" disabled>↩️ 실행 취소</button>
        <button class="win95-btn" id="btn-hint">💡 힌트</button>
      </div>

      <div class="header-panel">
        <div class="led-box" id="led-mines">010</div>
        <button class="win95-btn smiley-btn" id="btn-smiley">🙂</button>
        <div class="led-box" id="led-time">000</div>
      </div>

      <div class="board-scroll" id="board-scroll">
        <div class="mine-grid" id="mine-grid"></div>
      </div>

      <div class="mode-bar">
        <button class="win95-btn mode-btn active" id="btn-mode-dig">⛏️ 땅파기 모드</button>
        <button class="win95-btn mode-btn" id="btn-mode-flag">🚩 깃발 모드</button>
      </div>

      <div class="status-bar">
        <div class="status-box" id="status-msg">첫 클릭은 100% 안전합니다. 길게 누르면 깃발이 꽂힙니다.</div>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    const Sound = {
      enabled: localStorage.getItem('win95_mine_sound') !== '0',
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      play(notes) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        let t = this.ctx.currentTime;
        notes.forEach(([freq, dur, type = 'square', vol = 0.08]) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + dur);
          t += dur;
        });
      },
      step() { this.play([[760, 0.025]]); },
      flag() { this.play([[520, 0.03], [880, 0.04]]); },
      boom() { this.play([[160, 0.06, 'sawtooth', 0.14], [105, 0.09, 'sawtooth', 0.14], [65, 0.18, 'sawtooth', 0.14]]); },
      win()  { this.play([[523, 0.09], [659, 0.09], [784, 0.09], [1046, 0.24]]); }
    };

    const DIFFICULTIES = {
      beginner:     { rows: 9,  cols: 9,  mines: 10 },
      intermediate: { rows: 16, cols: 16, mines: 40 },
      expert:       { rows: 30, cols: 16, mines: 99 }
    };

    let state = {
      diffKey: localStorage.getItem('win95_mine_diff') || 'beginner',
      grid: [],
      minesGenerated: false,
      gameOver: false,
      won: false,
      flagMode: false,
      seconds: 0,
      undoStack: [],
      hoverR: -1,
      hoverC: -1
    };
    let timerHandle = null;

    function formatLED(n) {
      const clamped = Math.max(-99, Math.min(999, n));
      if (clamped < 0) return '-' + String(Math.abs(clamped)).padStart(2, '0');
      return String(clamped).padStart(3, '0');
    }

    function saveUndo() {
      state.undoStack.push(JSON.stringify({
        grid: state.grid,
        minesGenerated: state.minesGenerated,
        gameOver: state.gameOver,
        won: state.won
      }));
      if (state.undoStack.length > 25) state.undoStack.shift();
      document.getElementById('btn-undo').disabled = false;
    }

    function newGame() {
      clearInterval(timerHandle);
      timerHandle = null;
      state.seconds = 0;
      state.minesGenerated = false;
      state.gameOver = false;
      state.won = false;
      state.undoStack = [];
      document.getElementById('btn-undo').disabled = true;
      document.getElementById('btn-smiley').textContent = '🙂';

      const { rows, cols } = DIFFICULTIES[state.diffKey];
      state.grid = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push({
            r, c,
            mine: false,
            revealed: false,
            mark: 0, // 0 none, 1 flag, 2 ?
            count: 0,
            triggered: false,
            hint: false
          });
        }
        state.grid.push(row);
      }
      const best = localStorage.getItem(`win95_mine_best_${state.diffKey}`);
      setStatus(`첫 클릭은 100% 안전합니다. ${best ? `(최고 기록: ${best}초)` : '길게 누르면 깃발이 꽂힙니다.'}`);
      Sound.step();
      render();
    }

    function neighbors(r, c) {
      const { rows, cols } = DIFFICULTIES[state.diffKey];
      const list = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) list.push([nr, nc]);
        }
      }
      return list;
    }

    function generateMines(safeR, safeC) {
      const { rows, cols, mines } = DIFFICULTIES[state.diffKey];
      const candidates = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
          candidates.push([r, c]);
        }
      }
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (let i = 0; i < Math.min(mines, candidates.length); i++) {
        const [mr, mc] = candidates[i];
        state.grid[mr][mc].mine = true;
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!state.grid[r][c].mine) {
            state.grid[r][c].count = neighbors(r, c).filter(([nr, nc]) => state.grid[nr][nc].mine).length;
          }
        }
      }
      state.minesGenerated = true;
      timerHandle = setInterval(() => {
        if (!state.gameOver && !state.won && state.seconds < 999) {
          state.seconds++;
          document.getElementById('led-time').textContent = formatLED(state.seconds);
        }
      }, 1000);
    }

    function revealCell(r, c) {
      const cell = state.grid[r][c];
      if (cell.revealed || cell.mark === 1) return;
      cell.revealed = true;
      cell.mark = 0;

      if (cell.mine) {
        cell.triggered = true;
        state.gameOver = true;
        clearInterval(timerHandle);
        document.getElementById('btn-smiley').textContent = '😵';
        state.grid.flat().forEach(x => {
          if (x.mine && x.mark !== 1) x.revealed = true;
        });
        setStatus('💥 지뢰 폭발! [실행 취소] 버튼으로 복구하거나 스마일을 눌러 재시작하세요.');
        Sound.boom();
        return;
      }

      Sound.step();
      if (cell.count === 0) {
        const q = [[r, c]];
        while (q.length) {
          const [cr, cc] = q.shift();
          for (const [nr, nc] of neighbors(cr, cc)) {
            const nb = state.grid[nr][nc];
            if (!nb.revealed && nb.mark !== 1 && !nb.mine) {
              nb.revealed = true;
              nb.mark = 0;
              if (nb.count === 0) q.push([nr, nc]);
            }
          }
        }
      }
    }

    function checkWin() {
      if (state.gameOver) return;
      const allSafeRevealed = state.grid.flat().every(c => c.mine || c.revealed);
      if (!allSafeRevealed) return;
      state.won = true;
      clearInterval(timerHandle);
      document.getElementById('btn-smiley').textContent = '😎';
      state.grid.flat().forEach(c => { if (c.mine) c.mark = 1; });

      const key = `win95_mine_best_${state.diffKey}`;
      const prev = Number(localStorage.getItem(key) || 0);
      if (prev === 0 || (state.seconds > 0 && state.seconds < prev)) {
        localStorage.setItem(key, String(state.seconds));
        setStatus(`🎉 클리어! 신기록 달성: ${state.seconds}초!`);
      } else {
        setStatus(`🎉 축하합니다! 모든 지뢰를 찾았습니다 (${state.seconds}초)`);
      }
      Sound.win();
    }

    function toggleFlag(r, c) {
      if (state.gameOver || state.won) return;
      const cell = state.grid[r][c];
      if (cell.revealed) return;
      saveUndo();
      cell.mark = (cell.mark + 1) % 3;
      Sound.flag();
      render();
    }

    function onCellTap(r, c) {
      if (state.gameOver || state.won) return;
      state.grid.flat().forEach(x => x.hint = false);
      const cell = state.grid[r][c];

      if (cell.revealed) {
        if (cell.count > 0) {
          const adj = neighbors(r, c);
          const flags = adj.filter(([nr, nc]) => state.grid[nr][nc].mark === 1).length;
          const unrevealed = adj.filter(([nr, nc]) => !state.grid[nr][nc].revealed && state.grid[nr][nc].mark !== 1);

          // Case 1: Flags match number -> Open all remaining unflagged neighbors! (Classic Chording)
          if (flags === cell.count && unrevealed.length > 0) {
            saveUndo();
            unrevealed.forEach(([nr, nc]) => revealCell(nr, nc));
            checkWin();
            render();
            return;
          }

          // Case 2: Remaining hidden cells + flags === number -> Smart Auto-Flag remaining cells!
          if (unrevealed.length > 0 && flags + unrevealed.length === cell.count) {
            saveUndo();
            unrevealed.forEach(([nr, nc]) => {
              state.grid[nr][nc].mark = 1;
            });
            setStatus(`🚩 숫자 ${cell.count} 주변의 확정 지뢰 ${unrevealed.length}개를 자동으로 깃발 표시했습니다!`);
            Sound.flag();
            render();
            return;
          }

          setStatus(`숫자 ${cell.count}: 주변 깃발이 ${flags}개입니다. (${cell.count}개가 맞춰지면 한 번에 열립니다)`);
        }
        return;
      }

      if (state.flagMode) {
        toggleFlag(r, c);
        return;
      }

      if (cell.mark === 1) {
        setStatus('깃발이 꽂힌 칸입니다. 길게 누르거나 깃발 모드에서 해제하세요.');
        return;
      }

      saveUndo();
      if (!state.minesGenerated) generateMines(r, c);
      revealCell(r, c);
      checkWin();
      render();
    }

    function setStatus(msg) {
      document.getElementById('status-msg').textContent = msg;
    }

    function render() {
      const { rows, cols, mines } = DIFFICULTIES[state.diffKey];
      const flagged = state.grid.flat().filter(x => x.mark === 1).length;
      document.getElementById('led-mines').textContent = formatLED(mines - flagged);
      document.getElementById('led-time').textContent = formatLED(state.seconds);

      const scrollEl = document.getElementById('board-scroll');
      const availW = scrollEl.clientWidth - 16;
      const availH = scrollEl.clientHeight - 16;
      const cellSize = state.diffKey === 'beginner'
        ? Math.max(30, Math.min(40, Math.floor(Math.min(availW / cols, availH / rows))))
        : Math.max(22, Math.min(29, Math.floor(availW / cols)));

      const gridEl = document.getElementById('mine-grid');
      gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
      gridEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = state.grid[r][c];
          const el = document.createElement('div');
          el.className = 'cell';
          el.style.width = `${cellSize}px`;
          el.style.height = `${cellSize}px`;
          el.style.fontSize = `${Math.floor(cellSize * 0.58)}px`;

          if (cell.revealed) {
            el.classList.add('revealed');
            if (cell.triggered) el.classList.add('triggered');
            if (cell.mine) {
              el.textContent = '💣';
            } else if (cell.count > 0) {
              el.textContent = cell.count;
              el.classList.add(`n${cell.count}`);
            }
          } else {
            if (cell.hint) el.classList.add('hint-safe');
            if (state.gameOver && !cell.mine && cell.mark === 1) {
              el.textContent = '❌';
            } else if (cell.mark === 1) {
              el.textContent = '🚩';
            } else if (cell.mark === 2) {
              el.textContent = '?';
            }
          }

          el.dataset.r = r;
          el.dataset.c = c;

          // Long-press & tap support for iPhone touch + MacBook Trackpad + Classic Win95 Chord Preview
          let pressTimer = null;
          let longPressed = false;

          function showChordPreview(active) {
            document.querySelectorAll('.cell.chord-preview').forEach(node => node.classList.remove('chord-preview'));
            if (!active || state.gameOver || state.won) return;
            const targetList = [[r, c], ...neighbors(r, c)];
            targetList.forEach(([nr, nc]) => {
              const nb = state.grid[nr][nc];
              if (!nb.revealed && nb.mark !== 1) {
                const domCell = document.querySelector(`.cell[data-r="${nr}"][data-c="${nc}"]`);
                if (domCell) domCell.classList.add('chord-preview');
              }
            });
          }

          el.addEventListener('mouseenter', () => {
            state.hoverR = r;
            state.hoverC = c;
          });

          el.addEventListener('mousedown', (e) => {
            state.hoverR = r;
            state.hoverC = c;
            if (!state.gameOver && !state.won) document.getElementById('btn-smiley').textContent = '😮';
            // Classic Win95 Left+Right simultaneous press OR pressing on an already revealed number shows 3x3 sunken preview!
            if (e.buttons === 3 || cell.revealed) {
              showChordPreview(true);
            }
            if (e.button !== 0) return; // Only left click for long-press flag
            longPressed = false;
            if (!cell.revealed) {
              pressTimer = setTimeout(() => {
                longPressed = true;
                document.getElementById('btn-smiley').textContent = '🙂';
                toggleFlag(r, c);
              }, 250);
            }
          });
          el.addEventListener('mouseup', (e) => {
            clearTimeout(pressTimer);
            showChordPreview(false);
            if (!state.gameOver && !state.won) document.getElementById('btn-smiley').textContent = '🙂';
          });
          el.addEventListener('mouseleave', () => {
            clearTimeout(pressTimer);
            showChordPreview(false);
          });

          el.addEventListener('touchstart', () => {
            longPressed = false;
            if (!state.gameOver && !state.won) document.getElementById('btn-smiley').textContent = '😮';
            if (cell.revealed) {
              showChordPreview(true);
            } else {
              pressTimer = setTimeout(() => {
                longPressed = true;
                document.getElementById('btn-smiley').textContent = '🙂';
                toggleFlag(r, c);
              }, 280);
            }
          }, { passive: true });
          el.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
            showChordPreview(false);
            if (!state.gameOver && !state.won) document.getElementById('btn-smiley').textContent = '🙂';
          });
          el.addEventListener('touchmove', () => clearTimeout(pressTimer));
          el.addEventListener('click', (e) => {
            e.preventDefault();
            if (longPressed) return;
            // MacBook Trackpad modifier click: Shift / Ctrl / Option(Alt) / Command + Click -> Flag!
            if (e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) {
              toggleFlag(r, c);
              return;
            }
            onCellTap(r, c);
          });
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            clearTimeout(pressTimer);
            toggleFlag(r, c);
          });

          gridEl.appendChild(el);
        }
      }
    }

    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.diff === state.diffKey);
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.diffKey = btn.dataset.diff;
        localStorage.setItem('win95_mine_diff', state.diffKey);
        newGame();
      });
    });

    document.getElementById('btn-smiley').addEventListener('click', newGame);
    document.getElementById('btn-mode-dig').addEventListener('click', () => {
      state.flagMode = false;
      document.getElementById('btn-mode-dig').classList.add('active');
      document.getElementById('btn-mode-flag').classList.remove('active', 'flag-active');
      Sound.step();
    });
    document.getElementById('btn-mode-flag').addEventListener('click', () => {
      state.flagMode = true;
      document.getElementById('btn-mode-flag').classList.add('active', 'flag-active');
      document.getElementById('btn-mode-dig').classList.remove('active');
      Sound.flag();
    });

    document.getElementById('btn-undo').addEventListener('click', () => {
      if (!state.undoStack.length) return;
      const snap = JSON.parse(state.undoStack.pop());
      state.grid = snap.grid;
      state.minesGenerated = snap.minesGenerated;
      state.gameOver = snap.gameOver;
      state.won = snap.won;
      document.getElementById('btn-smiley').textContent = '🙂';
      document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
      setStatus('실행 취소 완료 (지뢰 폭발 전 상태로 복구됨)');
      Sound.step();
      render();
    });

    document.getElementById('btn-hint').addEventListener('click', () => {
      if (state.gameOver || state.won) return;
      state.grid.flat().forEach(x => x.hint = false);
      if (!state.minesGenerated) {
        const { rows, cols } = DIFFICULTIES[state.diffKey];
        state.grid[Math.floor(rows / 2)][Math.floor(cols / 2)].hint = true;
        setStatus('💡 힌트: 초록색으로 표시된 중앙 칸을 눌러 시작하세요!');
        Sound.step(); render(); return;
      }
      const candidates = state.grid.flat().filter(c => !c.revealed && !c.mine && c.mark !== 1);
      const adjacentSafe = candidates.find(c => neighbors(c.r, c.c).some(([nr, nc]) => state.grid[nr][nc].revealed));
      const pick = adjacentSafe || candidates[0];
      if (pick) {
        pick.hint = true;
        setStatus(`💡 힌트: 초록색 칸(${pick.r + 1}행 ${pick.c + 1}열)은 지뢰가 없는 안전 칸입니다!`);
        Sound.step();
        render();
      }
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      Sound.enabled = !Sound.enabled;
      localStorage.setItem('win95_mine_sound', Sound.enabled ? '1' : '0');
      e.currentTarget.textContent = Sound.enabled ? '🔊' : '🔇';
    });

    window.addEventListener('keydown', (e) => {
      if (state.gameOver || state.won) return;
      // Spacebar or 'F' key flags the hovered cell (or chords if already revealed)
      if (e.code === 'Space' || e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') {
        e.preventDefault();
        const { hoverR, hoverC } = state;
        if (hoverR >= 0 && hoverC >= 0 && state.grid[hoverR] && state.grid[hoverR][hoverC]) {
          const cell = state.grid[hoverR][hoverC];
          if (cell.revealed) {
            onCellTap(hoverR, hoverC); // Chord revealed number!
          } else {
            toggleFlag(hoverR, hoverC);
          }
        }
      }
    });

    window.addEventListener('resize', render);
    newGame();
  </script>
</body>
</html>
